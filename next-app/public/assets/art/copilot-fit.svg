<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Copilot is bought for its address, not its intelligence.">
  <rect width="1600" height="800" fill="#ffffff"/>
  <rect x="80" y="70" width="680" height="420" rx="18" fill="#FAF7F2" stroke="#E8E4DD"/>
  <rect x="840" y="70" width="680" height="420" rx="18" fill="#ffffff" stroke="#E8E4DD"/>
  <rect x="80" y="70" width="6" height="420" rx="3" fill="#2C4BE0"/>
  <rect x="840" y="70" width="6" height="420" rx="3" fill="#1a1a1a"/>
  <text x="130" y="140" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="21" letter-spacing="3.5" fill="#1B2EA0">WHERE IT EARNS ITS KEEP</text>
  <text x="890" y="140" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="21" letter-spacing="3.5" fill="#1a1a1a">WHERE IT WILL BURN YOU</text>
  <text x="130" y="220" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#1a1a1a">Teams already paying for Microsoft</text>
  <text x="130" y="260" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#1a1a1a">365, especially in Excel and</text>
  <text x="130" y="300" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#1a1a1a">Outlook.</text>
  <text x="890" y="220" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#1a1a1a">The price. Thirty dollars per</text>
  <text x="890" y="260" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#1a1a1a">person per month adds up fast on a</text>
  <text x="890" y="300" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#1a1a1a">small team.</text>
  <rect x="80" y="560" width="1440" height="1" fill="#E8E4DD"/>
  <text x="800" y="606" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="20" letter-spacing="3.5" fill="#1B2EA0">WHAT I WOULD ACTUALLY DO</text>
  <text x="800" y="648" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic" fill="#1B2EA0">Trial it on the five people who live in Excel and Outlook. Not the whole</text>
  <text x="800" y="690" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic" fill="#1B2EA0">company.</text>
</svg>
