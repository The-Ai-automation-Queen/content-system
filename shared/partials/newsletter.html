<section class="newsletter" aria-labelledby="nl-title">
  <div class="nl-grid">
    <div class="nl-copy">
      <p class="eyebrow mono">The Insider Brief</p>
      <h2 id="nl-title">Get one clear verdict a week on the AI news that matters.</h2>
      <p>Every week. What changed, whether you should care, and what to do about it. Free.</p>
      <form class="capture-form" action="https://auto.shiftandlead.com/webhook/formspree-lead" method="POST" data-source="newsletter">
        <label class="visually-hidden" for="nl-email">Email address</label>
        <input id="nl-email" type="email" name="email" required autocomplete="email" placeholder="your@email.com">
        <input type="hidden" name="source" value="newsletter">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <button type="submit">Subscribe free</button>
      </form>
      <p class="capture-fineprint">No cost, no catch. Unsubscribe anytime.</p>
    </div>
    <div class="nl-art">
      <img src="/assets/art/insider-brief.svg" alt="A weekly briefing card showing three headlines each marked with a plain verdict." loading="lazy" decoding="async" width="480" height="360">
    </div>
  </div>
</section>
