# brief.shiftandlead.com served from the estate VPS, same repo as everything else.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then: certbot --nginx -d brief.shiftandlead.com && nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name brief.shiftandlead.com;

    root /home/deploy/content-system/ai-insider-brief/ai-insider-brief;
    # ^ adjust to the actual repo path on the VPS ($HOME/content-system per bootstrap-vps.sh)
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /data/ {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
