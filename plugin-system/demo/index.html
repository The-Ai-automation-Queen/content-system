<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugin Demo — How Customers Use It</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
      line-height: 1.6;
    }
    h1 { color: #6c5ce7; }
    .embed-code {
      background: #1e1e2e;
      color: #a6e3a1;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      overflow-x: auto;
      margin: 20px 0;
    }
    .section { margin: 40px 0; }
    hr { border: none; border-top: 1px solid #eee; margin: 40px 0; }
  </style>
</head>
<body>

  <h1>Plugin Demo</h1>
  <p>This page simulates what your <strong>customer's website</strong> looks like after they embed your plugin.</p>

  <div class="section">
    <h2>What the customer pastes:</h2>
    <div class="embed-code">
      &lt;div id="my-plugin"&gt;&lt;/div&gt;<br>
      &lt;script<br>
      &nbsp;&nbsp;src="plugin.js"<br>
      &nbsp;&nbsp;data-license="DEMO"<br>
      &nbsp;&nbsp;data-container="#my-plugin"<br>
      &nbsp;&nbsp;data-theme="light"<br>
      &gt;&lt;/script&gt;
    </div>
  </div>

  <hr>

  <h2>Light Theme</h2>
  <div id="my-plugin"></div>

  <hr>

  <h2>Dark Theme</h2>
  <div id="my-plugin-dark"></div>

  <!-- ═══════════════════════════════════════════
       THIS IS THE EMBED — one script tag per instance
       ═══════════════════════════════════════════ -->

  <!-- Light theme instance -->
  <script
    src="../src/plugin.js"
    data-license="DEMO"
    data-container="#my-plugin"
    data-theme="light"
  ></script>

  <!-- Dark theme instance (loaded separately to demo multi-instance) -->
  <script>
    // For a second instance, we manually init since plugin.js guards against double-load.
    // In production, each customer only has ONE instance, so this isn't needed.
    (function () {
      var container = document.getElementById('my-plugin-dark');
      var root = document.createElement('div');
      root.className = 'myplugin-root';
      root.setAttribute('data-theme', 'dark');
      root.style.setProperty('--myplugin-accent', '#a29bfe');
      root.innerHTML =
        '<h3 class="myplugin-title">Content Analyzer</h3>' +
        '<textarea class="myplugin-textarea" placeholder="Paste your content here..."></textarea>' +
        '<button class="myplugin-btn">Analyze</button>' +
        '<div class="myplugin-result"></div>';

      var textarea = root.querySelector('.myplugin-textarea');
      var btn = root.querySelector('.myplugin-btn');
      var result = root.querySelector('.myplugin-result');

      btn.addEventListener('click', function () {
        var text = textarea.value;
        if (!text.trim()) { result.textContent = 'Please enter some text.'; return; }
        var words = text.trim().split(/\s+/).length;
        var sentences = text.split(/[.!?]+/).filter(function (s) { return s.trim(); }).length;
        var readingTime = Math.ceil(words / 200);
        var avg = sentences > 0 ? Math.round(words / sentences) : 0;
        result.innerHTML =
          '<strong>' + words + '</strong> words · ' +
          '<strong>' + sentences + '</strong> sentences · ' +
          '<strong>' + readingTime + ' min</strong> read · ' +
          '<strong>' + avg + '</strong> words/sentence';
      });

      container.appendChild(root);
    })();
  </script>

</body>
</html>
