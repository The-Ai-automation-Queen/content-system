<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Tool — Local Version (Before Plugin Conversion)</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .tool-box { border: 2px solid #6c5ce7; border-radius: 12px; padding: 24px; }
    .tool-box h2 { margin-top: 0; color: #6c5ce7; }
    .tool-box textarea { width: 100%; height: 100px; margin: 12px 0; padding: 8px; border-radius: 6px; border: 1px solid #ddd; }
    .tool-box button { background: #6c5ce7; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .tool-box button:hover { background: #5a4bd1; }
    .tool-box .result { margin-top: 16px; padding: 12px; background: #f8f8ff; border-radius: 6px; min-height: 40px; }
  </style>
</head>
<body>

  <h1>My Local HTML Tool</h1>
  <p>This is a normal HTML file running locally. We'll convert this into a plugin.</p>

  <div class="tool-box">
    <h2>Content Analyzer</h2>
    <textarea id="input" placeholder="Paste your content here..."></textarea>
    <button onclick="analyze()">Analyze</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    function analyze() {
      const text = document.getElementById('input').value;
      if (!text.trim()) { document.getElementById('result').textContent = 'Please enter some text.'; return; }
      const words = text.trim().split(/\s+/).length;
      const sentences = text.split(/[.!?]+/).filter(s => s.trim()).length;
      const readingTime = Math.ceil(words / 200);
      document.getElementById('result').innerHTML =
        `<strong>${words}</strong> words · <strong>${sentences}</strong> sentences · <strong>${readingTime} min</strong> read`;
    }
  </script>

</body>
</html>
