 permission prompts\"}],[\"$\",\"p\",null,{\"children\":[\"Choose \",[\"$\",\"strong\",\"1-Always ask\",{\"children\":\"Always ask\"}],\" when it is available, so ChatGPT asks before it uses the connected app.\"]}],\"$undefined\"]}],[\"$\",\"li\",\"Use the app deliberately\",{\"children\":[[\"$\",\"h3\",null,{\"children\":\"Use the app deliberately\"}],[\"$\",\"p\",null,{\"children\":[\"Open a chat and select the connected app from the tools menu only when the task needs it.\"]}],\"$undefined\"]}],[\"$\",\"li\",\"Disconnect it properly\",{\"children\":[[\"$\",\"h3\",null,{\"children\":\"Disconnect it properly\"}],[\"$\",\"p\",null,{\"children\":[\"Return to \",[\"$\",\"strong\",\"1-Settings → Apps\",{\"children\":\"Settings → Apps\"}],\", select the app and disconnect it. This stops future access but does not remove information already used in previous chats or memories.\"]}],\"$undefined\"]}]]}]]}]\n18:[\"$\",\"section\",\"Start free and upgrade for a reason\",{\"className\":\"guide-reading-page_section__39M9m\",\"children\":[[\"$\",\"h2\",null,{\"children\":\"Start free and upgrade for a reason\"}],[[\"$\",\"p\",\"The free plan is enough to find out whether ChatGPT helps with your work.\",{\"children\":[\"The free plan is enough to find out whether ChatGPT helps with your work.\"]}],[\"$\",\"p\",\"Consider paying only when you repeatedly reach a limit during useful work, need a feature unavailable on your plan or can clearly see that the time saved is worth the subscription.\",{\"children\":[\"Consider paying only when you repeatedly reach a limit during useful work, need a feature unavailable on your plan or can clearly see that the time saved is worth the subscription.\"]}]],[\"$\",\"blockquote\",null,{\"children\":[\"Do not upgrade because one vague instruction produced a weak answer. Improve the task, context and checking process first.\"]}]]}]\n19:[\"$\",\"section\",null,{\"className\":\"guide-reading-page_tryNow__j9x4P\",\"children\":[[\"$\",\"h2\",null,{\"c
